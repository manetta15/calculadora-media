<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Calculadora Arimetrica Simples</title>

</head>

<body>


<div class="container">
     <h1> 📚Calculadora de Média </h1>
     <p class="subtitulo">Sistema de notas do aluno</p>

     <div id="formulario">
         <label>Nome do Aluno:</label>
         <input type="text" id="nome" placeholder="Digite o nome do aluno" required>

         
         <label>Nome da Disciplina:</label>
        <select id="disciplina" required>
  <option value="">Selecione a disciplina</option>
  <option value="FDD">Fundamentos do Design Digital</option>
  <option value="FDDI">Fotografia Digital</option>
  <option value="PRAAI">Projetos de Áudio e Vídeo </option>
        </select>


         <div class="notas">
              <div>
            <label> 1° Bimestre</label>
            <input type="number" id="nota1"
            placeholder="Digite a nota" required>
             </div>
             <div>
            <label> 2° Bimestre</label>
            <input type="number" id="nota2"
            placeholder="Digite a nota" class="notas" required>
             </div>
              <div>
            <label> 3° Bimestre</label>
            <input type="number" id="nota3"
            placeholder="Digite a nota" class="notas" required>
              </div>
              <div>
            <label> 4° Bimestre</label>
            <input type="number" id="nota4"
            placeholder="Digite a nota" required>
             </div>

         </div>   


         <button id="calcular" onclick="calcularMedia()">
              Calcular Média
         </button>

          <button id="novocalculo" onclick="calcularNovo()">
              Calcular Novamente
         </button>

         <a href=" " id="link">Calculadora Normal</a>

         <div id="resultado" class="resultado">
          <p>Preencha os dados acima e clique em calcular média</p>
     </div>
</div>

<script src="./js/calcular-media.js"></script>

    
</body>
</html>
